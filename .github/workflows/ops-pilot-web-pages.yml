# War room do OpsPilot → GitHub Pages (module-04-agentes-autonomos/ops-pilot/specs/016-web-pages-deploy).
# Push em master que toca o web/ checa e publica; PR só checa; dá para disparar à mão.
name: "OpsPilot web → Pages"

on:
  push:
    branches: [master]
    paths:
      - "module-04-agentes-autonomos/ops-pilot/web/**"
      - ".github/workflows/ops-pilot-web-pages.yml"
  pull_request:
    paths:
      - "module-04-agentes-autonomos/ops-pilot/web/**"
      - ".github/workflows/ops-pilot-web-pages.yml"
  workflow_dispatch:

# Mínimo por padrão: só leitura do código. Só o job de deploy ganha mais (Princípio VI).
permissions:
  contents: read

jobs:
  check:
    name: Typecheck, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Checagens antigas do mesmo ramo/PR são canceladas; não afeta a fila de publicação.
    concurrency:
      group: ops-pilot-web-check-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: module-04-agentes-autonomos/ops-pilot/web
    env:
      # Site de projeto: /<repo>/opspilot/ — acompanha uma renomeação do repositório.
      OPSPILOT_WEB_BASE: /${{ github.event.repository.name }}/opspilot/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: module-04-agentes-autonomos/ops-pilot/web/package-lock.json

      - name: Instalar dependências (lockfile)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build

      - name: Validar o build com o caminho base do Pages
        run: npm test

      - name: Montar o site (war room em opspilot/ + redirecionamento na raiz)
        if: github.event_name != 'pull_request'
        run: |
          rm -rf _site
          mkdir -p _site/opspilot
          cp -R dist/. _site/opspilot/
          cat > _site/index.html <<'EOF'
          <!doctype html>
          <html lang="pt-BR">
            <head>
              <meta charset="UTF-8" />
              <meta http-equiv="refresh" content="0; url=./opspilot/" />
              <title>OpsPilot · War room</title>
            </head>
            <body>
              <p><a href="./opspilot/">Abrir a war room</a></p>
            </body>
          </html>
          EOF

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          # `path` não segue o working-directory: é relativo à raiz do repositório.
          path: module-04-agentes-autonomos/ops-pilot/web/_site

  deploy:
    name: Publicar no Pages
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Uma publicação em andamento termina; a pendente mais nova substitui as antigas.
    concurrency:
      group: pages-ops-pilot
      cancel-in-progress: false
    # O mínimo exigido pelo deploy-pages: criar o deploy e obter o token OIDC.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
